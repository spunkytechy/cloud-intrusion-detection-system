{% extends "base.html" %}
{% block title %}Login — Cloud IDS{% endblock %}
{% block public_content %}
<div style="background:#1e1e2e;border:1px solid #333;border-radius:12px;padding:2rem;">
  <div class="text-center mb-4">
    <i class="bi bi-shield-exclamation" style="font-size:3rem;color:#dc3545;"></i>
    <h4 class="mt-2" style="color:#fff;">Cloud IDS</h4>
    <p style="color:#888;font-size:.85rem;">Intrusion Detection System</p>
  </div>

  <form method="POST" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="mb-3">
      <label class="form-label" style="color:#ccc;">Username</label>
      <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus/>
    </div>
    <div class="mb-3">
      <label class="form-label" style="color:#ccc;">Password</label>
      <input type="password" name="password" class="form-control" placeholder="Enter password" required/>
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" name="remember" class="form-check-input" id="remember"/>
      <label class="form-check-label" style="color:#888;" for="remember">Remember me</label>
    </div>
    <button type="submit" class="btn btn-danger w-100">Login</button>
  </form>

  <hr style="border-color:#333;margin:1.25rem 0;"/>
  <p class="text-center mb-0" style="color:#888;font-size:.875rem;">
    No account?
    <a href="{{ url_for('auth.register') }}" style="color:#dc3545;">Register</a>
  </p>
</div>
{% endblock %}
